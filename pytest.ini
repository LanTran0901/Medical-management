[pytest]
# Gốc project phải nằm trên sys.path để `import app` (Docker / CI không cài package editable).
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths =
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage (pytest-cov). Tắt nhanh: pytest --no-cov
addopts =
    --cov=app
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html:htmlcov
