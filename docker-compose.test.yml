# Chạy pytest trong container với PostgreSQL (có extension `vector` cho migration RAG / pgvector).
#
#   docker compose -f docker-compose.test.yml build --no-cache test
#   docker compose -f docker-compose.test.yml run --rm test
#
# Dọn DB test (volume):
#   docker compose -f docker-compose.test.yml down -v --remove-orphans
#
# Chỉ unit test (nhanh, không cần DB):
#   docker compose -f docker-compose.test.yml run --rm test \
#     sh -c "pytest tests/test_family_permission.py -v --no-cov"
#
# Xem thêm: tests/README.md

services:
  postgres:
    # Cần cho `CREATE EXTENSION vector` trong Alembic (medical dictionary RAG).
    image: pgvector/pgvector:pg16
    container_name: medical-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical"]
      interval: 3s
      timeout: 5s
      retries: 15
    networks:
      - medical-test-net

  test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_TEST_DEPS: "1"
    container_name: medical-api-test
    restart: "no"
    env_file:
      - docker/test.env
    environment:
      HOMEDMEDAI_INTEGRATION: "1"
      SKIP_MONGO_LIFESPAN: "1"
      # Override host-mounted .env DATABASE_URL so app + alembic hit the same Postgres service
      # No ssl= query param: psycopg2 (alembic) rejects ?ssl=; asyncpg ok without it on internal network
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/medical
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: []
    # Một lệnh: migrate + toàn bộ pytest (xem scripts/run_all_tests.py)
    command: >
      sh -c "cd /app && python scripts/run_all_tests.py"
    networks:
      - medical-test-net

networks:
  medical-test-net:
    driver: bridge
